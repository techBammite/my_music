name: Deploy Main Application (EC2 Smart Pipeline)

on:
  push:
    branches:
      - main
    paths:
      - 'server.js'
      - 'src/**'
      - 'package.json'
      - 'infra/app/**'
      - '.github/workflows/deploy-app-ec2.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-app:
    name: Smart Deploy & Auto-Diagnose EC2 Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-3' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ./infra/app

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./infra/app

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve
        working-directory: ./infra/app

      - name: Package Application Code
        run: |
          echo "Packaging application zip..."
          zip -r app.zip . -x "node_modules/*" ".git/*" "infra/*" ".github/*" "uploads/*"

      - name: Upload Release to S3
        run: |
          DEPLOY_BUCKET=$(cd infra/app && terraform output -raw s3_deploy_bucket_name)
          echo "Uploading code to s3://$DEPLOY_BUCKET/latest/app.zip..."
          aws s3 cp app.zip "s3://$DEPLOY_BUCKET/latest/app.zip"

      - name: Remote Smart Deployment & Diagnostics via AWS SSM
        run: |
          INSTANCE_ID=$(cd infra/app && terraform output -raw instance_id)
          DEPLOY_BUCKET=$(cd infra/app && terraform output -raw s3_deploy_bucket_name)

          echo "Attente de 15s pour l'enregistrement de l'agent SSM sur $INSTANCE_ID..."
          sleep 15

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands": [
              "echo \"=== 1. INSTALLATION DEPENDANCES & PREPARATION Dossier ===\"",
              "dnf install -y nodejs git unzip curl awscli net-tools",
              "mkdir -p /var/www/mymusic",
              "cd /var/www/mymusic",
              "aws s3 cp s3://'"$DEPLOY_BUCKET"'/latest/app.zip app.zip",
              "unzip -o app.zip",
              "rm -f app.zip",
              "npm install --production || true",

              "echo \"=== 2. CREATION FICHIER .ENV & SERVICE SYSTEMD ===\"",
              "cat << \"EOF_ENV\" > /var/www/mymusic/.env\nPORT=80\nHOST=0.0.0.0\nNODE_ENV=production\nDB_HOST=mymusic-db-952b3825.cbi2io2eyuyd.eu-west-3.rds.amazonaws.com\nDB_PORT=3306\nDB_USER=mymusic_admin\nDB_PASSWORD=MyMusicPassword2026!\nDB_NAME=my_music\nEOF_ENV",

              "cat << \"EOF_SERVICE\" > /etc/systemd/system/mymusic.service\n[Unit]\nDescription=MyMusic Application\nAfter=network.target\n\n[Service]\nType=simple\nUser=root\nWorkingDirectory=/var/www/mymusic\nExecStart=/usr/bin/node server.js\nRestart=always\nRestartSec=5\nEnvironment=NODE_ENV=production\nEnvironment=PORT=80\nEnvironment=HOST=0.0.0.0\nEnvironment=DB_HOST=mymusic-db-952b3825.cbi2io2eyuyd.eu-west-3.rds.amazonaws.com\nEnvironment=DB_PORT=3306\nEnvironment=DB_USER=mymusic_admin\nEnvironment=DB_PASSWORD=MyMusicPassword2026!\nEnvironment=DB_NAME=my_music\n\n[Install]\nWantedBy=multi-user.target\nEOF_SERVICE",

              "systemctl daemon-reload",
              "systemctl enable mymusic",
              "systemctl restart mymusic || true",
              "sleep 4",

              "echo \"=== 3. TEST DE CONNEXION LOCALE SUR PORT 80 ===\"",
              "if curl -s -f http://localhost:80/ > /dev/null ; then",
              "  echo \"✅ SUCCES : L application principale réponds parfaitement sur le port 80 !\"",
              "else",
              "  echo \"⚠️ ECHEC PORT 80 : L application principale ne réponds pas. Déclenchement des diagnostics...\"",
              "  echo \"--- DIAGNOSTIC 1: STATUT SERVICE ---\"",
              "  systemctl status mymusic || true",
              "  echo \"--- DIAGNOSTIC 2: LOGS RECENT (JOURNALCTL) ---\"",
              "  journalctl -u mymusic -n 40 --no-pager || true",
              "  echo \"--- DIAGNOSTIC 3: PORTS ECOUTES ---\"",
              "  netstat -tlpn || true",
              "  echo \"--- DIAGNOSTIC 4: LOGS CLOUD-INIT ---\"",
              "  tail -n 30 /var/log/user-data.log || true",

              "  echo \"=== 4. ACTIVATION DU SERVEUR DE SECOURS (FALLBACK HTML) ===\"",
              "  cat << \"EOF_FB\" > /var/www/mymusic/fallback.js\nconst http = require(\"http\");\nhttp.createServer((req, res) => {\n  res.writeHead(200, { \"Content-Type\": \"text/html; charset=utf-8\" });\n  res.end(\"<!DOCTYPE html><html><head><meta charset=\\\"UTF-8\\\"><title>MyMusic - Test</title><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;} .card{background:#1e293b;padding:2.5rem;border-radius:1rem;text-align:center;} h1{color:#22c55e;}</style></head><body><div class=\\\"card\\\"><h1>🚀 Serveur EC2 Accessible (Fallback HTML)</h1><p>Le serveur Web EC2 réponds sur le port 80 !</p></div></body></html>\");\n}).listen(80, \"0.0.0.0\", () => console.log(\"Fallback running on port 80\"));\nEOF_FB",

              "  cat << \"EOF_SERVICE_FB\" > /etc/systemd/system/mymusic.service\n[Unit]\nDescription=MyMusic Application Fallback\nAfter=network.target\n\n[Service]\nType=simple\nUser=root\nWorkingDirectory=/var/www/mymusic\nExecStart=/usr/bin/node fallback.js\nRestart=always\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\nEOF_SERVICE_FB",

              "  systemctl daemon-reload",
              "  systemctl restart mymusic",
              "  sleep 2",
              "  echo \"--- RESULTAT APRES ACTIVATION DU SERVEUR DE SECOURS ---\"",
              "  curl -i http://localhost:80/ || true",
              "fi"
            ]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent with ID: $COMMAND_ID. Waiting for completion..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          LOGS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text)
          echo "$LOGS"

          echo "### 🔍 Compte-Rendu des Tests & Diagnostics EC2" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          echo "$LOGS" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Display Application Web URL
        run: |
          APP_URL=$(cd infra/app && terraform output -raw app_url)
          echo "=========================================================="
          echo "🌐 Live Website URL: $APP_URL"
          echo "=========================================================="
          echo "Access website: **[$APP_URL]($APP_URL)**" >> $GITHUB_STEP_SUMMARY
