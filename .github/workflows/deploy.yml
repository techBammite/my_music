name: Deploy MyMusic Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-3' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ./infra

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./infra

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve
        working-directory: ./infra

      - name: Package Application Code
        run: |
          echo "Packaging application zip..."
          zip -r app.zip . -x "node_modules/*" ".git/*" "infra/*" ".github/*" "uploads/*"

      - name: Upload Release to S3
        run: |
          DEPLOY_BUCKET=$(cd infra && terraform output -raw s3_deploy_bucket_name)
          echo "Uploading code to s3://$DEPLOY_BUCKET/latest/app.zip..."
          aws s3 cp app.zip "s3://$DEPLOY_BUCKET/latest/app.zip"

      - name: Remote Deploy via AWS SSM Command
        run: |
          INSTANCE_ID=$(cd infra && terraform output -raw instance_id)
          DEPLOY_BUCKET=$(cd infra && terraform output -raw s3_deploy_bucket_name)

          echo "Deploying remotely on EC2 instance $INSTANCE_ID..."
          echo "Attente de 20s pour l'enregistrement de l'agent SSM..."
          sleep 20

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "dnf install -y mariadb105-server nodejs git unzip curl awscli",
              "systemctl enable mariadb --now",
              "mysql -e \"CREATE DATABASE IF NOT EXISTS my_music; CREATE USER IF NOT EXISTS '\''mymusic_user'\''@'\''localhost'\'' IDENTIFIED BY '\''MyMusicPassword2026!'\''; GRANT ALL PRIVILEGES ON my_music.* TO '\''mymusic_user'\''@'\''localhost'\''; FLUSH PRIVILEGES;\"",
              "mkdir -p /var/www/mymusic",
              "cd /var/www/mymusic",
              "aws s3 cp s3://'"$DEPLOY_BUCKET"'/latest/app.zip app.zip",
              "unzip -o app.zip",
              "rm -f app.zip",
              "npm install --production",
              "systemctl daemon-reload",
              "systemctl enable mymusic",
              "systemctl restart mymusic"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent with ID: $COMMAND_ID. Waiting for completion..."

          # Attente de la fin de l'execution SSM
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          
          # Affichage des logs d'execution SSM
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text

      - name: Display Application URL
        run: |
          APP_URL=$(cd infra && terraform output -raw app_url)
          PUBLIC_IP=$(cd infra && terraform output -raw public_ip)
          echo "=========================================================="
          echo "🎉 MYMUSIC APPLICATION DEPLOYED SUCCESSFULLY!"
          echo "🌐 Direct Website URL: $APP_URL"
          echo "=========================================================="
          echo "### 🚀 Application Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "Access your live site here: **[$APP_URL]($APP_URL)**" >> $GITHUB_STEP_SUMMARY
