name: Deploy My Music to AWS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-and-deploy:
    name: Terraform Apply & Application Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-3' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: ./infra
        continue-on-error: true

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./infra

      - name: Cleanup Old Test VPCs
        run: |
          echo "Automated Cleanup: Deleting any old failed test VPCs..."
          VPC_IDS=$(aws ec2 describe-vpcs --region ${{ secrets.AWS_REGION || 'eu-west-3' }} --query "Vpcs[?contains(Tags[?Key=='Name'].Value | [0], 'mymusic-vpc')].VpcId" --output text)
          for vpc_id in $VPC_IDS; do
            if [ -n "$vpc_id" ]; then
              echo "Cleaning up VPC: $vpc_id"
              IGW_ID=$(aws ec2 describe-internet-gateways --region ${{ secrets.AWS_REGION || 'eu-west-3' }} --filters "Name=attachment.vpc-id,Values=$vpc_id" --query "InternetGateways[*].InternetGatewayId" --output text)
              if [ -n "$IGW_ID" ]; then
                aws ec2 detach-internet-gateway --region ${{ secrets.AWS_REGION || 'eu-west-3' }} --internet-gateway-id "$IGW_ID" --vpc-id "$vpc_id" || true
                aws ec2 delete-internet-gateway --region ${{ secrets.AWS_REGION || 'eu-west-3' }} --internet-gateway-id "$IGW_ID" || true
              fi
              SUBNET_IDS=$(aws ec2 describe-subnets --region ${{ secrets.AWS_REGION || 'eu-west-3' }} --filters "Name=vpc-id,Values=$vpc_id" --query "Subnets[*].SubnetId" --output text)
              for sub_id in $SUBNET_IDS; do
                aws ec2 delete-subnet --region ${{ secrets.AWS_REGION || 'eu-west-3' }} --subnet-id "$sub_id" || true
              done
              aws ec2 delete-vpc --region ${{ secrets.AWS_REGION || 'eu-west-3' }} --vpc-id "$vpc_id" || true
            fi
          done

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve
        working-directory: ./infra

      - name: Package Application Artifact
        run: |
          echo "Packaging application code..."
          zip -r app.zip . -x "node_modules/*" ".git/*" "infra/*" ".github/*" "uploads/*"

      - name: Upload Release Artifact to S3
        run: |
          DEPLOY_BUCKET=$(cd infra && terraform output -raw s3_deploy_bucket_name)
          echo "Uploading app.zip to s3://$DEPLOY_BUCKET/latest/app.zip"
          aws s3 cp app.zip "s3://$DEPLOY_BUCKET/latest/app.zip"
          aws s3 cp app.zip "s3://$DEPLOY_BUCKET/releases/app-${{ github.sha }}.zip"

      - name: Trigger EC2 Auto Scaling Group Instance Refresh
        run: |
          ASG_NAME=$(cd infra && terraform output -raw asg_name)
          if [ -n "$ASG_NAME" ]; then
            echo "Triggering Instance Refresh on ASG: $ASG_NAME"
            aws autoscaling start-instance-refresh --auto-scaling-group-name "$ASG_NAME" --preferences '{"MinHealthyPercentage": 50}'
          else
            echo "ASG not found, skipping Instance Refresh."
          fi

      - name: Display Deployment Endpoints
        run: |
          ALB_URL=$(cd infra && terraform output -raw alb_dns_name)
          CF_URL=$(cd infra && terraform output -raw cloudfront_domain_name)
          echo "=========================================================="
          echo "🎉 DÉPLOIEMENT RÉUSSI SUR AWS !"
          echo "=========================================================="
          echo "🌐 URL Application Load Balancer : http://$ALB_URL"
          echo "⚡ URL CloudFront CDN            : https://$CF_URL"
          echo "=========================================================="
          echo "ALB_URL=http://$ALB_URL" >> $GITHUB_ENV
          echo "CF_URL=https://$CF_URL" >> $GITHUB_ENV

          echo "## 🚀 URLs de votre Application Déployée" >> $GITHUB_STEP_SUMMARY
          echo "- **Application Load Balancer** : [http://$ALB_URL](http://$ALB_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront CDN (HTTPS)** : [https://$CF_URL](https://$CF_URL)" >> $GITHUB_STEP_SUMMARY
