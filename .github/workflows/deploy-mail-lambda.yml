name: Deploy Mail Microservice (AWS Lambda)

on:
  push:
    branches:
      - main
    paths:
      - 'src/service_auxiliere/mail/**'
      - 'infra/mail/**'
      - '.github/workflows/deploy-mail-lambda.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-mail:
    name: Deploy Mail Microservice to AWS Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-3' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Mail Lambda Package
        run: |
          echo "Building mail microservice zip package..."
          cd src/service_auxiliere/mail
          npm install --production
          zip -r ../../../infra/mail/mail.zip .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ./infra/mail

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./infra/mail

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve
        working-directory: ./infra/mail

      - name: Display Public Lambda Function URL
        run: |
          LAMBDA_URL=$(cd infra/mail && terraform output -raw lambda_function_url)
          echo "=========================================================="
          echo "🎉 MAIL LAMBDA MICROSERVICE DEPLOYED SUCCESSFULLY!"
          echo "🌐 Public Lambda Function URL: $LAMBDA_URL"
          echo "=========================================================="
          echo "### 🚀 Mail Microservice Deployed to AWS Lambda!" >> $GITHUB_STEP_SUMMARY
          echo "Public Function URL: **[$LAMBDA_URL]($LAMBDA_URL)**" >> $GITHUB_STEP_SUMMARY
          echo "Health Endpoint: **[${LAMBDA_URL}health](${LAMBDA_URL}health)**" >> $GITHUB_STEP_SUMMARY
