name: Destroy AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Tape "destroy" pour confirmer la destruction de l’infra AWS.'
        required: true
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-3' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Confirm destructive action
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "destroy" ]; then
            echo "Destroy non confirmé. Tapez 'destroy' dans le champ confirm_destroy pour continuer."
            exit 1
          fi

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ./infra

      - name: Terraform Plan Destroy
        run: terraform plan -destroy -input=false -no-color -out=tfplan
        working-directory: ./infra

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false -no-color
        working-directory: ./infra
